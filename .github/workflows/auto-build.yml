name: Auto build APK

# Rebuilds the signed release APK against the latest NZ:P game data (with game code
# built from our quakec fork) and publishes it as a
# GitHub release. Runs weekly and on manual trigger.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'   # Mondays, 06:00 UTC

permissions:
  contents: write   # create releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python (for quakec's hash table generator)
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build game code (.dats) from quakec
        # quakec is our fork, on the last upstream commit FTE can still run: upstream's PC
        # build moved to its own Vril engine, whose progs.dat calls builtins this one lacks
        run: |
          mkdir -p /tmp/keep
          pip install -q pandas fastcrc colorama
          cd quakec
          python3 bin/qc_hash_generator.py -i tools/asset_conversion_table.csv -o source/server/hash_table.qc
          mkdir -p build/fte   # fteqcc won't create its output dir
          cd bin
          ./fteqcc-cli-lin -DFTE -srcfile ../progs/csqc.src
          ./fteqcc-cli-lin -DFTE -srcfile ../progs/menu.src
          ./fteqcc-cli-lin -O3 -DFTE -srcfile ../progs/ssqc.src
          cp ../build/fte/csprogs.dat ../build/fte/menu.dat ../build/fte/qwprogs.dat /tmp/keep/

      - name: Fetch latest game data (nightly) and overlay our files
        run: |
          # keep our config + LAN list + on-screen touch control art (not in upstream)
          cp app/src/main/assets/nzp/nzportable.cfg /tmp/keep/
          cp app/src/main/assets/nzp/masters.txt   /tmp/keep/
          rm -rf /tmp/keep_touch && cp -r app/src/main/assets/nzp/gfx/touch /tmp/keep_touch
          curl -fL -o nzp.zip https://github.com/nzp-team/nzportable/releases/download/nightly/nzportable-linux64.zip
          rm -rf app/src/main/assets/nzp /tmp/nzpx
          mkdir -p /tmp/nzpx app/src/main/assets
          unzip -q nzp.zip -d /tmp/nzpx
          cp -r "$(find /tmp/nzpx -type d -name nzp | head -1)" app/src/main/assets/nzp
          # The nightly's progs.dat is the Vril server QC, which this engine can't run.
          # Drop it so it can never be picked up in place of our qwprogs.dat.
          rm -f app/src/main/assets/nzp/progs.dat
          # overlay our game code + preserved config + touch art
          cp /tmp/keep/csprogs.dat /tmp/keep/menu.dat /tmp/keep/qwprogs.dat /tmp/keep/nzportable.cfg /tmp/keep/masters.txt app/src/main/assets/nzp/
          # copy the contents, not the directory, so this still lands correctly if
          # upstream ever ships a gfx/touch of its own
          mkdir -p app/src/main/assets/nzp/gfx/touch
          cp -r /tmp/keep_touch/. app/src/main/assets/nzp/gfx/touch/

      - name: Smoke test - load every map on a dedicated server
        # Compiling the QuakeC and linking the engine prove nothing about whether
        # they agree: a builtin the engine lacks only fails when the server runs
        # it, and that once shipped weeks of releases that couldn't load a map.
        # So run this engine's server, headless, on the exact data going into the APK.
        run: |
          sudo apt-get install -y -q zlib1g-dev > /dev/null
          make -C fteqw/engine -j"$(nproc)" sv-rel FTE_TARGET=linux64 > /dev/null
          SV="$PWD/fteqw/engine/release/fteqw-sv64"
          MANIFEST="$PWD/app/src/main/assets/manifest/nzp.fmf"

          # run on a copy: the server writes configs next to the data, and a stray
          # one in the APK would pin settings
          SMOKE="$RUNNER_TEMP/smoke"
          rm -rf "$SMOKE" && mkdir -p "$SMOKE"
          cp -r app/src/main/assets/nzp "$SMOKE/nzp"
          cd "$SMOKE"

          failed=0
          for bsp in nzp/maps/*.bsp; do
            map=$(basename "$bsp" .bsp)
            rc=0
            out=$(timeout 60 "$SV" -nohome -basedir . -manifest "$MANIFEST" +sv_public 0 \
                    +map "$map" +wait +wait +status +wait +wait +quit 2>&1) || rc=$?
            if [ "$rc" -eq 0 ] && echo "$out" | grep -q "current map *: $map" \
                 && ! echo "$out" | grep -qE "SV_Error|not implemented|not compatible"; then
              echo "ok   $map"
            else
              echo "::error::map $map failed to load (exit $rc)"
              echo "$out" | grep -E "SV_Error|not implemented|not compatible|Error" | head -5
              failed=1
            fi
          done
          [ "$failed" -eq 0 ]


      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - run: sdkmanager "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon --console=plain

      - name: Keep the unstripped library for symbolising crashes
        # The APK ships a stripped .so, so a native tombstone arrives as bare
        # offsets. Retaining the unstripped build output means any crash report
        # from a published APK can be resolved back to real function names --
        # match them up by the GNU build ID.
        run: |
          UNSTRIPPED=$(find app/build/intermediates/cxx -name libftedroid.so -path '*arm64-v8a*' | head -1)
          if [ -n "$UNSTRIPPED" ]; then
            mkdir -p symbols
            cp "$UNSTRIPPED" symbols/
            echo "build-id: $(readelf -n "$UNSTRIPPED" | awk '/Build ID/{print $3}')" > symbols/BUILDID.txt
          else
            echo "::warning::no unstripped libftedroid.so found; crashes from this build cannot be symbolised"
          fi

      - name: Upload symbols
        if: hashFiles('symbols/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: symbols-${{ github.run_number }}
          path: symbols/
          retention-days: 90

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE=$(date +%Y%m%d)
          RUN=${{ github.run_number }}
          DATAVER=$(cat app/src/main/assets/nzp/version.txt 2>/dev/null || echo unknown)

          # The tag keeps a prefix so it reads as one and still sorts by date.
          # The APK name is decoupled from it: what someone sees in their
          # downloads folder should say when it was built, not how it was
          # triggered, so the date and build number carry it on their own.
          TAG="build-$DATE-$RUN"
          APK="nzportable-android-$DATE-$RUN.apk"

          mv app/build/outputs/apk/release/app-release.apk "$APK"
          gh release create "$TAG" "$APK" \
            --title "Build $DATE" \
            --notes "Automated build against the latest NZ:P (data $DATAVER)."
