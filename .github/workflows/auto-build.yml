name: Auto build APK

# Builds the signed release APK from the engine and game code forks and NZ:P's last
# FTE-era assets, checks them against each other on a dedicated server, and publishes it
# as a GitHub release. Runs weekly and on manual trigger.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'   # Mondays, 06:00 UTC

permissions:
  contents: write   # create releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python (for quakec's hash table generator)
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Assemble the game data
        run: |
          pip install -q pandas fastcrc colorama
          sudo apt-get install -y -q faketime > /dev/null
          tools/build-data.sh

      - name: Smoke test - load every map on a dedicated server
        run: |
          sudo apt-get install -y -q zlib1g-dev > /dev/null
          tools/smoke-test.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - run: sdkmanager "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon --console=plain

      - name: Check the APK carries all the game data
        run: |
          ( cd nzp && find . -type f; cd ../app/src/main/resources && find . -type f ) | sed 's#^\./##' | sort -u > "$RUNNER_TEMP/want"
          unzip -Z1 app/build/outputs/apk/release/app-release.apk | sort > "$RUNNER_TEMP/have"
          missing=$(comm -23 "$RUNNER_TEMP/want" "$RUNNER_TEMP/have")
          if [ -n "$missing" ]; then echo "::error::missing from the APK:"; echo "$missing"; exit 1; fi

      - name: Keep the unstripped library for symbolising crashes
        # The APK ships a stripped .so, so a native tombstone arrives as bare
        # offsets. Retaining the unstripped build output means any crash report
        # from a published APK can be resolved back to real function names --
        # match them up by the GNU build ID.
        run: |
          UNSTRIPPED=$(find app/build/intermediates/cxx -name libftedroid.so -path '*arm64-v8a*' | head -1)
          if [ -n "$UNSTRIPPED" ]; then
            mkdir -p symbols
            cp "$UNSTRIPPED" symbols/
            echo "build-id: $(readelf -n "$UNSTRIPPED" | awk '/Build ID/{print $3}')" > symbols/BUILDID.txt
          else
            echo "::warning::no unstripped libftedroid.so found; crashes from this build cannot be symbolised"
          fi

      - name: Upload symbols
        if: hashFiles('symbols/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: symbols-${{ github.run_number }}
          path: symbols/
          retention-days: 90

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE=$(date +%Y%m%d)
          RUN=${{ github.run_number }}

          # The tag keeps a prefix so it reads as one and still sorts by date.
          # The APK name is decoupled from it: what someone sees in their
          # downloads folder should say when it was built, not how it was
          # triggered, so the date and build number carry it on their own.
          TAG="build-$DATE-$RUN"
          APK="nzportable-android-$DATE-$RUN.apk"

          mv app/build/outputs/apk/release/app-release.apk "$APK"
          gh release create "$TAG" "$APK" \
            --title "Build $DATE" \
            --notes "Automated build."
