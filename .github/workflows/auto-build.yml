name: Auto build APK

# Rebuilds the signed release APK against the latest NZ:P (engine, game code, and data)
# and publishes it as a GitHub release. Runs weekly and on manual trigger.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'   # Mondays, 06:00 UTC

permissions:
  contents: write   # create releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build game code (.dats) from quakec
        run: |
          mkdir -p /tmp/keep
          # last resort: the .dats already bundled in the repo
          cp app/src/main/assets/nzp/csprogs.dat app/src/main/assets/nzp/menu.dat /tmp/keep/

          # our patch is LF but quakec's sources are CRLF, hence tr + --ignore-whitespace
          apply_patch() { tr -d '\r' < ../patches/0002-nzp-quakec.patch | git apply --3way --ignore-whitespace -; }

          build_dats() {
            chmod +x quakec/bin/fteqcc-cli-lin
            mkdir -p quakec/build/fte   # fteqcc won't create its output dir
            ( cd quakec/bin && ./fteqcc-cli-lin -DFTE -srcfile ../progs/csqc.src \
                            && ./fteqcc-cli-lin -DFTE -srcfile ../progs/menu.src )
            cp quakec/build/fte/csprogs.dat quakec/build/fte/menu.dat /tmp/keep/
          }

          git clone https://github.com/nzp-team/quakec.git quakec

          if ( cd quakec && apply_patch ) && build_dats; then
            echo "Using freshly built .dats from latest quakec"
          else
            # Latest upstream drifted away from the patch. Rather than shipping the
            # stale bundled .dats, rebuild against the commit the patch was made for --
            # that still gets our own changes in, just without the newest upstream work.
            BASE=$(cat patches/0002-base.txt)
            echo "::warning::patch did not apply to latest quakec; rebuilding at pinned base $BASE"
            rm -rf quakec/build
            if ( cd quakec && git checkout -q "$BASE" && git checkout -q -- . && apply_patch ) && build_dats; then
              echo "Using .dats built at the pinned base"
            else
              echo "::error::could not build .dats at the pinned base either; falling back to the bundled ones"
            fi
          fi

      - name: Fetch latest game data (nightly) and overlay our files
        run: |
          # keep our config + LAN list + on-screen touch control art (not in upstream)
          cp app/src/main/assets/nzp/nzportable.cfg /tmp/keep/
          cp app/src/main/assets/nzp/masters.txt   /tmp/keep/
          rm -rf /tmp/keep_touch && cp -r app/src/main/assets/nzp/gfx/touch /tmp/keep_touch
          curl -fL -o nzp.zip https://github.com/nzp-team/nzportable/releases/download/nightly/nzportable-linux64.zip
          rm -rf app/src/main/assets/nzp /tmp/nzpx
          mkdir -p /tmp/nzpx app/src/main/assets
          unzip -q nzp.zip -d /tmp/nzpx
          cp -r "$(find /tmp/nzpx -type d -name nzp | head -1)" app/src/main/assets/nzp
          # overlay our game code (fresh or bundled) + preserved config + touch art
          cp /tmp/keep/csprogs.dat /tmp/keep/menu.dat /tmp/keep/nzportable.cfg /tmp/keep/masters.txt app/src/main/assets/nzp/
          # copy the contents, not the directory, so this still lands correctly if
          # upstream ever ships a gfx/touch of its own
          mkdir -p app/src/main/assets/nzp/gfx/touch
          cp -r /tmp/keep_touch/. app/src/main/assets/nzp/gfx/touch/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v3
      - run: sdkmanager "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon --console=plain

      - name: Keep the unstripped library for symbolising crashes
        # The APK ships a stripped .so, so a native tombstone arrives as bare
        # offsets. Retaining the unstripped build output means any crash report
        # from a published APK can be resolved back to real function names --
        # match them up by the GNU build ID.
        run: |
          UNSTRIPPED=$(find app/build/intermediates/cxx -name libftedroid.so -path '*arm64-v8a*' | head -1)
          if [ -n "$UNSTRIPPED" ]; then
            mkdir -p symbols
            cp "$UNSTRIPPED" symbols/
            echo "build-id: $(readelf -n "$UNSTRIPPED" | awk '/Build ID/{print $3}')" > symbols/BUILDID.txt
          else
            echo "::warning::no unstripped libftedroid.so found; crashes from this build cannot be symbolised"
          fi

      - name: Upload symbols
        if: hashFiles('symbols/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: symbols-${{ github.run_number }}
          path: symbols/
          retention-days: 90

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE=$(date +%Y%m%d)
          RUN=${{ github.run_number }}
          DATAVER=$(cat app/src/main/assets/nzp/version.txt 2>/dev/null || echo unknown)

          # The tag keeps a prefix so it reads as one and still sorts by date.
          # The APK name is decoupled from it: what someone sees in their
          # downloads folder should say when it was built, not how it was
          # triggered, so the date and build number carry it on their own.
          TAG="build-$DATE-$RUN"
          APK="nzportable-android-$DATE-$RUN.apk"

          mv app/build/outputs/apk/release/app-release.apk "$APK"
          gh release create "$TAG" "$APK" \
            --title "Build $DATE" \
            --notes "Automated build against the latest NZ:P (data $DATAVER)."
